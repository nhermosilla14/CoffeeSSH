name: Build and publish Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      # Keep CI builds above the current 3 while remaining monotonic per workflow run.
      ANDROID_VERSION_CODE: ${{ 1000 + github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coffeessh-release.jks"
          chmod 600 "$RUNNER_TEMP/coffeessh-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coffeessh-release.jks
        run: ./gradlew :app:assembleRelease

      - name: Name release asset
        id: asset
        run: |
          timestamp=$(date -u +%Y%m%d-%H%M%S)
          asset="CoffeeSSH-${GITHUB_REF_NAME}-${timestamp}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$asset"
          echo "path=$RUNNER_TEMP/$asset" >> "$GITHUB_OUTPUT"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish nightly GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timestamp=$(date -u +%Y%m%d-%H%M%S)
          tag="nightly-$timestamp"
          gh release create "$tag" "${{ steps.asset.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "CoffeeSSH nightly $timestamp UTC" \
            --notes "Automated nightly build from commit $GITHUB_SHA." \
            --prerelease \
            --latest=false

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.asset.outputs.path }}" \
            --verify-tag \
            --title "CoffeeSSH $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
